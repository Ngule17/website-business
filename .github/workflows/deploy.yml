name: Deploy to GitHub Pages

# Publishes the static site to GitHub Pages on every push to the branches below,
# and on demand from the Actions tab. Requires Pages "Source" to be set to
# "GitHub Actions" once in Settings → Pages.
on:
  push:
    branches:
      - master
      - main
      - claude/ai-employees-agents-webapp-tjksa2
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; newer runs supersede in-progress ones.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        # One-time setup: in Settings → Pages, set Source to "GitHub Actions".
        # (GitHub does not permit the Actions token to enable Pages itself.)
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # The whole repo root is the site (index.html + assets/).
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
