<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Hire specialized AI employees and agents — sales, support, content, data and more. Put them to work in your own workspace.">
    <title>AI Workforce — Hire AI Employees & Agents</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🤖</text></svg>">
    <link href="assets/css/app.css" rel="stylesheet">
  </head>
  <body>
    <header class="site-header">
      <div class="site-header__inner">
        <a class="brand" href="#/">
          <span class="brand__logo">🤖</span>
          <span>AI Workforce</span>
        </a>
        <button class="btn btn-ghost small nav-toggle" id="nav-toggle" aria-label="Toggle menu">☰</button>
        <nav class="nav" id="nav">
          <a class="nav-link" href="#/">Home</a>
          <a class="nav-link" href="#/agents">Marketplace</a>
          <a class="nav-link" href="#/workspace">Workspace <span class="nav-count" data-nav-count></span></a>
          <a class="nav-link" href="#/missions">Missions</a>
          <a class="nav-link" href="#/activity">Activity</a>
          <a class="nav-link" href="#/ops">Operations <span class="nav-count" data-nav-ops></span></a>
          <a class="nav-link" href="#/settings">Settings</a>
        </nav>
      </div>
    </header>

    <main id="app"><!-- views render here --></main>

    <footer class="site-footer">
      <p>&copy; Steven Ngule · AI Workforce — hire AI employees that work 24/7.</p>
    </footer>

    <script src="assets/js/data.js"></script>
    <script src="assets/js/store.js"></script>
    <script src="assets/js/api.js"></script>
    <script src="assets/js/tools.js"></script>
    <script src="assets/js/agent.js"></script>
    <script src="assets/js/app.js"></script>
    <script>
      // Mobile nav toggle
      (function () {
        var t = document.getElementById("nav-toggle");
        var n = document.getElementById("nav");
        t.addEventListener("click", function () { n.classList.toggle("open"); });
        n.addEventListener("click", function (e) {
          if (e.target.closest(".nav-link")) n.classList.remove("open");
        });
      })();
    </script>
  </body>
</html>
